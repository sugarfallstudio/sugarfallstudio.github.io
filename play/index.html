<script>
  // ---- The one switch for launch day --------------------------------------
  // false: iPhone visitors see "coming soon" here (no broken App Store link).
  // true:  iPhone visitors go straight to the App Store page.
  var APP_STORE_LIVE = false;
  // ---------------------------------------------------------------------------
  var PLAY = "https://play.google.com/store/apps/details?id=com.sugarfallstudio.jellyplunge";
  var APPLE = "https://apps.apple.com/app/id6833125792";
  // ---- Install tracking ----------------------------------------------------
  // /play/?src=instagram (optionally &c=bio) passes utm_source=instagram to Google Play, so
  // Play Console counts store visits and installs from that source (Acquisition → UTM).
  // Same format as the Growth Suite's Tracked links.
  (function () {
    var MEDIUM = { tiktok: "social", instagram: "social", youtube: "social", facebook: "social", x: "social", website: "referral", email: "email", influencer: "influencer" };
    var q = new URLSearchParams(location.search);
    var clean = function (v) { return (v || "").toLowerCase().replace(/[^a-z0-9]+/g, "-").replace(/^-+|-+$/g, "").slice(0, 40); };
    var src = clean(q.get("src")) || "website";
    var camp = clean(q.get("c")) || (src === "website" ? "site" : "bio");
    var utm = "utm_source=" + src + "&utm_medium=" + (MEDIUM[src] || "referral") + "&utm_campaign=" + camp;
    PLAY += "&referrer=" + encodeURIComponent(utm);
  })();
  // ---------------------------------------------------------------------------
  (function () {
    var ua = navigator.userAgent || "";
    var stay = /[?&]stay\b/.test(location.search);   // ...?stay shows this page anywhere
    var ios = /iPhone|iPad|iPod/.test(ua) || (/Macintosh/.test(ua) && navigator.maxTouchPoints > 1);
    var android = /Android/.test(ua);
    if (stay) return;
    if (android) location.replace(PLAY);
    else if (ios && APP_STORE_LIVE) location.replace(APPLE);
  })();
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">

<style>
  body { background: linear-gradient(180deg, var(--sky-top), #7c4fe0 55%, var(--sky-bottom)); min-height: 100vh; color: #fff; }

  .card p.lead { margin: 0 0 26px; font-size: 1.1rem; }
  .stores { display: grid; gap: 14px; }
  .store { display: flex; align-items: center; justify-content: center; gap: 12px; padding: 14px 18px; border-radius: 18px;
           border: 4px solid var(--ink); text-decoration: none; color: #fff; font-family: "Lilita One", system-ui, sans-serif; font-size: 1.25rem;

  .store small { display: block; font-family: system-ui, -apple-system, sans-serif; font-size: .8rem; opacity: .9; letter-spacing: 0; }

  .store .txt { text-align: left; line-height: 1.15; }
  a.store:hover { transform: translateY(-2px); }
  .google { background: var(--green); }
  .apple { background: #1b1230; }
  .apple.soon { background: rgba(27,18,48,.55); border-style: dashed; cursor: default; box-shadow: none; }
  .note { margin-top: 18px; font-size: .95rem; min-height: 1.4em; }
  .shot { width: min(260px, 70vw); margin: 30px auto 0; border-radius: 26px; border: 5px solid var(--ink); box-shadow: 0 14px 30px rgba(43,26,74,.35); }
  .foot { margin-top: 26px; font-size: .85rem; opacity: .9; }
  .foot a { color: #fff; }
</style>

<script>
  document.getElementById("google").href = PLAY;   // the button carries the same tracking
  if (!APP_STORE_LIVE) {
    var a = document.getElementById("apple");
    a.classList.add("soon");
    a.removeAttribute("href");
    a.setAttribute("aria-disabled", "true");
    document.getElementById("apple-small").textContent = "COMING SOON TO THE";
    var ua = navigator.userAgent || "";
    if (/iPhone|iPad|iPod/.test(ua) || (/Macintosh/.test(ua) && navigator.maxTouchPoints > 1)) {
      document.getElementById("note").textContent = "The iPhone version is in Apple's final checks. It'll be on the App Store very soon!";
    }
  }
</script>
